<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Блог и новости — FOOD BOOM</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff5e1a'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css?v=20261109">
</head>
<body style="background: #fef9f4;">

<header class="header" id="header">
    <div class="container header__inner">
        <a href="index.html" class="logo">FOOD<span>BOOM</span></a>
        <nav class="nav">
            <a href="index.html#menu">Меню</a>
            <a href="blog.html" style="color:var(--primary)">Блог</a>
            <a href="index.html#contacts">Контакты</a>
        </nav>
        <div class="header__actions">
            <a href="index.html" class="btn btn--primary">В меню</a>
        </div>
    </div>
</header>

<main class="section" style="padding-top: 120px;">
    <div class="container">
        <h1 class="section__title" style="text-align: center;">Новости и статьи</h1>
        <p class="section__subtitle" style="text-align: center; margin-bottom: 40px;">Делимся рецептами, новостями и акциями</p>
        
        <div id="newsContainer" aria-live="polite" aria-busy="true" style="max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">
            <p>Загружаем новости…</p>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer__bottom">
            <p>© 2026 FOOD BOOM. Все права защищены.</p>
        </div>
    </div>
</footer>

<script>
    async function loadNews() {
        const container = document.getElementById('newsContainer');
        container.setAttribute('aria-busy', 'true');
        try {
            const res = await fetch('api/get_news.php');
            if (!res.ok) throw new Error('Failed to load news');
            const news = await res.json();
            const fragment = document.createDocumentFragment();
            if (!news.length) {
                const empty = document.createElement('p');
                empty.textContent = 'Пока новостей нет.';
                fragment.appendChild(empty);
            }
            for (const item of news) {
                const article = document.createElement('article');
                article.className = 'news-card';
                const date = document.createElement('p');
                date.className = 'news-card__date';
                date.textContent = new Date(item.date).toLocaleDateString('ru-RU');
                const title = document.createElement('h2');
                title.textContent = item.title;
                const body = document.createElement('p');
                body.className = 'news-card__text';
                body.textContent = item.content;
                article.append(date, title, body);
                fragment.appendChild(article);
            }
            container.replaceChildren(fragment);
        } catch (e) {
            container.textContent = 'Не удалось загрузить новости. ';
            const retry = document.createElement('button');
            retry.type = 'button';
            retry.className = 'btn btn--outline';
            retry.textContent = 'Повторить';
            retry.addEventListener('click', loadNews);
            container.appendChild(retry);
        } finally { container.setAttribute('aria-busy', 'false'); }
    }
    loadNews();
</script>
</body>
</html>
